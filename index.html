<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>카카오맵 장소 검색 서비스 - 카테고리 탭 추가</title>
    <style>
        /* 기본 여백 제거 및 화면 전체 크기 사용 */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Malgun Gothic', '맑은 고딕', sans-serif;
        }

        /* 전체 레이아웃 (왼쪽, 오른쪽 2분할) */
        #container {
            display: flex;
            width: 100vw;
            height: 100vh;
        }

        /* 왼쪽: 탭 및 결과 리스트 영역 */
        #left-panel {
            width: 350px;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #ddd;
            background-color: #f9f9f9;
        }

        /* 탭 버튼 영역 */
        #tab-wrap {
            display: flex;
            border-bottom: 1px solid #ddd;
        }

        .tab-btn {
            flex: 1;
            padding: 15px;
            background-color: #eee;
            border: none;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            color: #555;
            transition: background-color 0.3s;
        }

        /* 선택된 탭의 디자인 */
        .tab-btn.active {
            background-color: #ffe812;
            color: #000;
        }

        .tab-btn:hover {
            background-color: #f4dd12;
        }

        /* 결과 리스트 영역 */
        #places-list {
            list-style: none;
            margin: 0;
            padding: 0;
            overflow-y: auto;
            flex: 1;
        }

        #places-list li {
            padding: 15px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
            background-color: #fff;
        }

        #places-list li:hover {
            background-color: #f0f0f0;
        }

        #places-list .place-name {
            font-weight: bold;
            font-size: 15px;
            color: #333;
            margin-bottom: 5px;
        }

        #places-list .address {
            font-size: 12px;
            color: #777;
        }
