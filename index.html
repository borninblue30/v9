
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>카카오맵 교육 장소 찾기</title>

    <style>
        /* 기본 페이지 설정 */
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, "Malgun Gothic", sans-serif;
            color: #222;
        }

        /* 왼쪽 목록과 오른쪽 지도를 나란히 배치 */
        .container {
            display: flex;
            width: 100%;
            height: 100vh;
        }

        /* 왼쪽 사이드바 */
        .sidebar {
            width: 360px;
            min-width: 300px;
            display: flex;
            flex-direction: column;
            background: white;
            border-right: 1px solid #ddd;
            z-index: 1;
        }

        /* 제목 영역 */
        .header {
            padding: 22px 20px 14px;
        }

        .header h1 {
            margin: 0 0 8px;
            font-size: 23px;
        }

        .header p {
            margin: 0;
            color: #777;
            font-size: 13px;
            line-height: 1.5;
        }

        /* 학교와 학원 탭 */
        .tabs {
            display: flex;
            gap: 8px;
            padding: 0 16px 14px;
        }

        .tab-button {
            flex: 1;
            padding: 12px 8px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: #f7f7f7;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }

        /* 현재 선택된 탭 */
        .tab-button.active {
            background: #fee500;
            border-color: #fee500;
            color: #222;
        }

        .tab-button:hover {
            filter: brightness(0.97);
        }

        /* 현재 위치 및 검색 상태 */
        #status {
            padding: 0 18px 12px;
            color: #666;
            font-size: 13px;
            line-height: 1.5;
        }

        /* 범례 영역 */
        .legend {
            display: flex;
            gap: 14px;
            padding: 10px 18px;
            border-top: 1px solid #eee;
            font-size: 12px;
            color: #555;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .legend-dot {
            width: 11px;
            height: 11px;
            border-radius: 50%;
        }

        .school-dot {
            background: #2878e5;
        }

        .academy-dot {
            background: #ed7d31;
        }

        /* 검색 결과 목록 */
        #results {
            flex: 1;
            overflow-y: auto;
            border-top: 1px solid #eee;
        }

        /* 장소 목록의 개별 항목 */
        .place-item {
            padding: 15px 18px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
        }

        .place-item:hover {
            background: #fffbea;
        }

        .place-name {
            margin-bottom: 7px;
            font-size: 15px;
            font-weight: bold;
        }

        .place-category {
            display: inline-block;
            margin-left: 5px;
            padding: 3px 6px;
            border-radius: 4px;
            background: #f2f2f2;
            color: #555;
            font-size: 10px;
            font-weight: normal;
            vertical-align: middle;
        }

        .place-address {
            color: #666;
            font-size: 12px;
            line-height: 1.6;
        }

        .place-phone {
            margin-top: 5px;
            color: #888;
            font-size: 12px;
        }

        /* 오른쪽 지도 */
        .map-area {
            position: relative;
            flex: 1;
            min-width: 0;
            height: 100%;
        }

        #map {
            width: 100%;
            height: 100%;
            background: #f1f1f1;
        }

        /* 교통정보 버튼 */
        #trafficButton {
            position: absolute;
            top: 15px;
            right: 15px;
            z-index: 2;
            padding: 11px 14px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: white;
            box-shadow: 0 2px 6px #0000001a;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
        }

        #trafficButton.active {
            background: #2878e5;
            color: white;
            border-color: #2878e5;
        }

        /* 지도 위 장소 마커 */
        .custom-marker {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            border: 2px solid white;
            border-radius: 50%;
            color: white;
            font-size: 14px;
            font-weight: bold;
            box-shadow: 0 2px 5px #00000040;
        }

        /* 마커 팝업 */
        .info-window {
            min-width: 150px;
            max-width: 240px;
            padding: 10px 12px;
            color: #222;
            font-size: 12px;
            line-height: 1.6;
            overflow-wrap: anywhere;
        }

        .info-title {
            margin-bottom: 4px;
            font-size: 14px;
            font-weight: bold;
        }

        .info-address {
            color: #666;
        }

        /* 작은 화면에 맞춘 설정 */
        @media (max-width: 600px) {
            .sidebar {
                width: 45%;
                min-width: 175px;
            }

            .header {
                padding: 16px 10px 12px;
            }

            .header h1 {
                font-size: 18px;
            }

            .header p {
                font-size: 11px;
            }

            .tabs {
                gap: 5px;
                padding: 0 8px 12px;
            }

            .tab-button {
                padding: 10px 4px;
                font-size: 12px;
            }

            .legend {
                flex-wrap: wrap;
                gap: 8px;
                padding: 9px;
                font-size: 10px;
            }

            .place-item {
                padding: 12px 9px;
            }

            .place-name {
                font-size: 13px;
            }

            #status {
                padding: 0 10px 10px;
                font-size: 11px;
            }

            #trafficButton {
                top: 8px;
                right: 8px;
                padding: 9px;
                font-size: 11px;
            }
        }
    </style>
</head>

<body>
    <div class="container">

        <!-- 왼쪽 장소 검색 영역 -->
        <aside class="sidebar">

            <div class="header">
                <h1>교육 장소 찾기</h1>
                <p>현재 위치 주변의 학교와 학원을 찾아보세요.</p>
            </div>

            <!-- 학교와 학원 카테고리 탭 -->
            <div class="tabs">
                <button
                    class="tab-button active"
                    id="schoolTab"
                    type="button"
                    aria-pressed="true"
                >
                    🏫 학교
                </button>

                <button
                    class="tab-button"
                    id="academyTab"
                    type="button"
                    aria-pressed="false"
                >
                    📚 학원
                </button>
            </div>

            <!-- 위치 및 검색 결과 안내 -->
            <div id="status" role="status" aria-live="polite">
                지도를 불러오는 중입니다.
            </div>

            <!-- 마커 색상 범례 -->
            <div class="legend">
                <div class="legend-item">
                    <span class="legend-dot school-dot"></span>
                    학교
                </div>

                <div class="legend-item">
                    <span class="legend-dot academy-dot"></span>
                    학원
                </div>
            </div>

            <!-- 검색 결과 목록 -->
            <div id="results"></div>

        </aside>

        <!-- 오른쪽 지도 영역 -->
        <main class="map-area">
            <div id="map"></div>

            <!-- 교통정보 표시 전환 버튼 -->
            <button
                id="trafficButton"
                type="button"
                aria-pressed="false"
            >
                🚦 교통정보 켜기
            </button>
        </main>

    </div>

    <!-- 카카오맵 SDK와 장소 검색 라이브러리 -->
    <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=14139c11c2a0b3471c025372e7030cc7&libraries=services&autoload=false"></script>

    <script>
        // HTML 요소 가져오기
        const statusElement = document.getElementById("status");
        const resultsElement = document.getElementById("results");
        const schoolTab = document.getElementById("schoolTab");
        const academyTab = document.getElementById("academyTab");
        const trafficButton = document.getElementById("trafficButton");

        // 지도와 검색에 필요한 변수
        let map;
        let placesService;
        let currentMarker = null;
        let placeMarkers = [];
        let activeInfoWindow = null;

        // 현재 위치와 검색 설정
        let currentPosition = null;
        let currentCategory = "SC4";
        let trafficEnabled = false;
        let searchRequestId = 0;

        // 지도 확대 레벨과 검색 반경 설정
        const mapLevel = 5;
        const searchRadius = 5000;

        // 카테고리별 마커 색상과 글자 설정
        const markerStyles = {
            SC4: {
                color: "#2878e5",
                label: "교",
                name: "학교"
            },
            AC5: {
                color: "#ed7d31",
                label: "학",
                name: "학원"
            }
        };

        // 카카오맵 SDK가 준비되면 지도를 생성
        function loadMap() {
            kakao.maps.load(function() {
                initializeMap();
            });
        }

        // 지도 초기화
        function initializeMap() {
            // 기본 위치는 서울시청으로 설정
            const defaultPosition = new kakao.maps.LatLng(
                37.5665,
                126.9780
            );

            // 지도 생성
            map = new kakao.maps.Map(
                document.getElementById("map"),
                {
                    center: defaultPosition,
                    level: mapLevel
                }
            );

            // 장소 카테고리 검색 서비스 생성
            placesService = new kakao.maps.services.Places();

            // 지도 크기와 표시 상태 갱신
            map.relayout();

            // 학교 탭 클릭 이벤트
            schoolTab.addEventListener("click", function() {
                changeCategory("SC4");
            });

            // 학원 탭 클릭 이벤트
            academyTab.addEventListener("click", function() {
                changeCategory("AC5");
            });

            // 교통정보 버튼 이벤트
            trafficButton.addEventListener("click", toggleTraffic);

            // 지도가 생성된 뒤 현재 위치 확인
            getCurrentLocation();
        }

        // 현재 위치 확인
        function getCurrentLocation() {
            // 위치 정보 기능을 지원하는지 확인
            if (!navigator.geolocation) {
                statusElement.textContent =
                    "위치 정보를 사용할 수 없습니다. 서울시청 주변을 표시합니다.";

                // 기본 위치를 기준으로 장소 검색
                currentPosition = new kakao.maps.LatLng(
                    37.5665,
                    126.9780
                );

                searchNearbyPlaces();
                return;
            }

            statusElement.textContent =
                "현재 위치를 확인하고 있습니다. 위치 권한을 허용해 주세요.";

            // 브라우저에 현재 위치 요청
            navigator.geolocation.getCurrentPosition(
                function(position) {
                    // 현재 위치의 위도와 경도 저장
                    const latitude = position.coords.latitude;
                    const longitude = position.coords.longitude;

                    currentPosition = new kakao.maps.LatLng(
                        latitude,
                        longitude
                    );

                    // 지도를 현재 위치로 이동
                    map.setCenter(currentPosition);
                    map.setLevel(mapLevel);

                    // 현재 위치 마커 생성
                    currentMarker = new kakao.maps.Marker({
                        map: map,
                        position: currentPosition
                    });

                    statusElement.textContent =
                        "현재 위치 주변의 학교를 찾고 있습니다.";

                    // 현재 위치를 기준으로 학교 검색
                    searchNearbyPlaces();
                },
                function(error) {
                    // 위치 확인 실패 시 기본 위치 사용
                    currentPosition = new kakao.maps.LatLng(
                        37.5665,
                        126.9780
                    );

                    map.setCenter(currentPosition);

                    if (error.code === 1) {
                        statusElement.textContent =
                            "위치 권한이 거부되어 서울시청 주변을 표시합니다.";
                    } else {
                        statusElement.textContent =
                            "현재 위치를 확인하지 못해 서울시청 주변을 표시합니다.";
                    }

                    // 기본 위치를 기준으로 검색
                    searchNearbyPlaces();
                },
                {
                    // 위치 조회 설정
                    enableHighAccuracy: true,
                    timeout: 10000,
                    maximumAge: 0
                }
            );
        }

        // 학교 또는 학원 탭 전환
        function changeCategory(categoryCode) {
            // 현재 카테고리 저장
            currentCategory = categoryCode;

            // 선택된 탭의 디자인 변경
            schoolTab.classList.toggle(
                "active",
                categoryCode === "SC4"
            );

            academyTab.classList.toggle(
                "active",
                categoryCode === "AC5"
            );

            // 접근성을 위한 선택 상태 변경
            schoolTab.setAttribute(
                "aria-pressed",
                String(categoryCode === "SC4")
            );

            academyTab.setAttribute(
                "aria-pressed",
                String(categoryCode === "AC5")
            );

            // 이전 검색 요청의 결과가 뒤늦게 표시되지 않도록 처리
            searchRequestId++;

            // 이전 결과와 마커 삭제
            clearSearchResults();

            // 현재 위치를 기준으로 새 카테고리 검색
            searchNearbyPlaces();
        }

        // 이전 검색 결과와 마커 삭제
        function clearSearchResults() {
            // 이전 검색 목록 지우기
            resultsElement.replaceChildren();

            // 이전 검색 마커 제거
            placeMarkers.forEach(function(marker) {
                marker.setMap(null);
            });

            placeMarkers = [];

            // 열려 있는 장소 정보 팝업 닫기
            if (activeInfoWindow) {
                activeInfoWindow.close();
                activeInfoWindow = null;
            }

            // 현재 위치 마커는 삭제하지 않음
        }

        // 현재 위치 주변의 장소 검색
        function searchNearbyPlaces() {
            // 위치 정보가 없으면 검색하지 않음
            if (!currentPosition) {
                statusElement.textContent =
                    "현재 위치를 확인한 후 검색할 수 있습니다.";
                return;
            }

            // 검색할 카테고리의 이름 가져오기
            const categoryName = markerStyles[currentCategory].name;

            // 검색 요청 번호 기록
            const requestId = ++searchRequestId;

            statusElement.textContent =
                categoryName + " 주변 장소를 검색하고 있습니다.";

            // 카카오 카테고리 검색 API 실행
            placesService.categorySearch(
                currentCategory,
                function(data, result, pagination) {
                    // 더 새로운 검색이 시작되었다면 이전 결과 무시
                    if (requestId !== searchRequestId) {
                        return;
                    }

                    // 검색 결과가 없는 경우
                    if (
                        result ===
                        kakao.maps.services.Status.ZERO_RESULT
                    ) {
                        statusElement.textContent =
                            "주변에서 검색 결과를 찾지 못했습니다.";
                        return;
                    }

                    // 검색 오류 처리
                    if (
                        result !==
                        kakao.maps.services.Status.OK
                    ) {
                        statusElement.textContent =
                            "검색에 실패했습니다. 잠시 후 다시 시도해 주세요.";
                        return;
                    }

                    // 검색 결과 표시
                    statusElement.textContent =
                        categoryName + " " + data.length + "개를 찾았습니다.";

                    // 검색된 장소를 목록과 지도에 표시
                    data.forEach(function(place, index) {
                        addPlace(place, index);
                    });

                    // 검색 결과가 있으면 모든 장소가 보이도록 지도 조정
                    if (data.length > 0) {
                        const bounds = new kakao.maps.LatLngBounds();

                        data.forEach(function(place) {
                            bounds.extend(
                                new kakao.maps.LatLng(
                                    Number(place.y),
                                    Number(place.x)
                                )
                            );
                        });

                        // 현재 위치도 지도 범위에 포함
                        bounds.extend(currentPosition);

                        map.setBounds(bounds, 50, 50, 50, 50);
                    }
                },
                {
                    // 현재 위치를 검색 중심으로 설정
                    location: currentPosition,

                    // 현재 위치 주변 5km 이내 검색
                    radius: searchRadius,

                    // 가까운 장소부터 표시
                    sort: kakao.maps.services.SortBy.DISTANCE
                }
            );
        }

        // 검색 결과를 목록과 지도에 추가
        function addPlace(place, index) {
            // 장소 좌표 생성
            const position = new kakao.maps.LatLng(
                Number(place.y),
                Number(place.x)
            );

            // 카테고리에 맞는 마커 스타일 선택
            const style = markerStyles[currentCategory];

            // 지도에 표시할 마커 디자인 생성
            const markerContent = document.createElement("div");

            markerContent.className = "custom-marker";
            markerContent.style.backgroundColor = style.color;
            markerContent.textContent = style.label;

            // 카카오맵 커스텀 오버레이 생성
            const marker = new kakao.maps.CustomOverlay({
                position: position,
                content: markerContent,
                yAnchor: 1.2,
                zIndex: 3
            });

            // 지도에 마커 표시
            marker.setMap(map);

            // 마커 목록에 저장
            placeMarkers.push(marker);

            // 마커를 클릭하면 장소 정보 표시
            markerContent.style.cursor = "pointer";

            markerContent.addEventListener("click", function() {
                showPlaceInfo(place, position);
            });

            // 왼쪽 목록 항목 생성
            const item = document.createElement("div");
            item.className = "place-item";

            // 장소 이름
            const nameElement = document.createElement("div");
            nameElement.className = "place-name";
            nameElement.textContent = place.place_name;

            // 학교 또는 학원 구분 표시
            const categoryElement = document.createElement("span");
            categoryElement.className = "place-category";
            categoryElement.textContent = style.name;

            nameElement.appendChild(categoryElement);

            // 주소 표시
            const addressElement = document.createElement("div");
            addressElement.className = "place-address";
            addressElement.textContent =
                place.road_address_name ||
                place.address_name ||
                "주소 정보 없음";

            // 전화번호 표시
            const phoneElement = document.createElement("div");
            phoneElement.className = "place-phone";
            phoneElement.textContent =
                place.phone || "전화번호 정보 없음";

            // 목록 항목에 정보 추가
            item.appendChild(nameElement);
            item.appendChild(addressElement);
            item.appendChild(phoneElement);

            // 목록을 클릭해도 지도와 팝업이 이동하도록 설정
            item.addEventListener("click", function() {
                map.panTo(position);
                showPlaceInfo(place, position);
            });

            // 목록에 항목 추가
            resultsElement.appendChild(item);
        }

        // 장소 이름과 주소를 팝업으로 표시
        function showPlaceInfo(place, position) {
            // 기존 팝업 닫기
            if (activeInfoWindow) {
                activeInfoWindow.setMap(null);
            }

            // 팝업 내용을 안전하게 생성
            const content = document.createElement("div");
            content.className = "info-window";

            const titleElement = document.createElement("div");
            titleElement.className = "info-title";
            titleElement.textContent = place.place_name;

            const addressElement = document.createElement("div");
            addressElement.className = "info-address";
            addressElement.textContent =
                place.road_address_name ||
                place.address_name ||
                "주소 정보 없음";

            content.appendChild(titleElement);
            content.appendChild(addressElement);

            // 장소 위치에 팝업 표시
            activeInfoWindow = new kakao.maps.CustomOverlay({
                position: position,
                content: content,
                yAnchor: 1.5,
                zIndex: 10
            });

            activeInfoWindow.setMap(map);
        }

        // 교통정보 표시 켜기 및 끄기
        function toggleTraffic() {
            // 교통정보 표시 상태 전환
            trafficEnabled = !trafficEnabled;

            if (trafficEnabled) {
                // 지도에 교통정보 오버레이 추가
                map.addOverlayMapTypeId(
                    kakao.maps.MapTypeId.TRAFFIC
                );

                trafficButton.textContent = "🚦 교통정보 끄기";
                trafficButton.classList.add("active");

                trafficButton.setAttribute("aria-pressed", "true");
            } else {
                // 지도에서 교통정보 오버레이 제거
                map.removeOverlayMapTypeId(
                    kakao.maps.MapTypeId.TRAFFIC
                );

                trafficButton.textContent = "🚦 교통정보 켜기";
                trafficButton.classList.remove("active");

                trafficButton.setAttribute("aria-pressed", "false");
            }
        }

        // 카카오맵 SDK가 준비된 경우에만 지도 실행
        if (window.kakao && window.kakao.maps) {
            loadMap();
        } else {
            statusElement.textContent =
                "카카오맵을 불러오지 못했습니다. 인터넷 연결과 JavaScript 키 설정을 확인해 주세요.";
        }
    </script>
</body>
</html>
