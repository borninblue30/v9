<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>카카오맵 장소 검색 서비스 - 카테고리 탭 추가</title>
    <style>
        /* 기본 여백 제거 및 화면 전체 크기 사용 */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Malgun Gothic', '맑은 고딕', sans-serif;
        }

        /* 전체 레이아웃 (왼쪽, 오른쪽 2분할) */
        #container {
            display: flex;
            width: 100vw;
            height: 100vh;
        }

        /* 왼쪽: 탭 및 결과 리스트 영역 */
        #left-panel {
            width: 350px;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #ddd;
            background-color: #f9f9f9;
        }

        /* 탭 버튼 영역 */
        #tab-wrap {
            display: flex;
            border-bottom: 1px solid #ddd;
        }

        .tab-btn {
            flex: 1;
            padding: 15px;
            background-color: #eee;
            border: none;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            color: #555;
            transition: background-color 0.3s;
        }

        /* 선택된 탭의 디자인 */
        .tab-btn.active {
            background-color: #ffe812;
            color: #000;
        }

        .tab-btn:hover {
            background-color: #f4dd12;
        }

        /* 결과 리스트 영역 */
        #places-list {
            list-style: none;
            margin: 0;
            padding: 0;
            overflow-y: auto;
            flex: 1;
        }

        #places-list li {
            padding: 15px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
            background-color: #fff;
        }

        #places-list li:hover {
            background-color: #f0f0f0;
        }

        #places-list .place-name {
            font-weight: bold;
            font-size: 15px;
            color: #333;
            margin-bottom: 5px;
        }

        #places-list .address {
            font-size: 12px;
            color: #777;
        }

        /* 오른쪽: 지도 영역 */
        #map-panel {
            flex: 1;
            position: relative; /* 교통정보 버튼을 지도 위에 띄우기 위해 설정 */
            height: 100%;
        }

        /* 교통정보 버튼 (지도 오른쪽 위) */
        #btn-traffic {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 2; /* 지도보다 위에 보이도록 설정 */
            padding: 10px 15px;
            background-color: #fff;
            border: 2px solid #ccc;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        
        #btn-traffic:hover {
            background-color: #f9f9f9;
        }

        /* 말풍선(인포윈도우) 내부 디자인 */
        .info-window {
            padding: 10px;
            font-size: 13px;
            border-radius: 5px;
        }
        .info-window .info-title {
            font-weight: bold;
            margin-bottom: 5px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div id="container">
        <!-- 왼쪽 화면: 탭 메뉴 및 리스트 -->
        <div id="left-panel">
            <div id="tab-wrap">
                <!-- 탭 1 (학교): SC4 -->
                <button id="tab-school" class="tab-btn" data-code="SC4">학교 (SC4)</button>
                <!-- 탭 2 (학원): AC5 -->
                <button id="tab-academy" class="tab-btn" data-code="AC5">학원 (AC5)</button>
            </div>
            <ul id="places-list"></ul>
        </div>

        <!-- 오른쪽 화면: 지도 -->
        <div id="map-panel">
            <!-- 교통정보 토글 버튼 -->
            <button id="btn-traffic">교통정보 켜기</button>
        </div>
    </div>

    <!-- 알려준 카카오맵 API 키가 적용된 스크립트 -->
    <script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=0284f30d15a21cd8c8d334026cc26d3b&libraries=services"></script>

    <script>
        window.onload = function() {
            
            // 1. 지도 초기화 설정
            var mapContainer = document.getElementById('map-panel');
            var mapOptions = {
                center: new kakao.maps.LatLng(37.566826, 126.9786567), // 기본 중심 좌표
                level: 5 // 확대 레벨 5
            };
            var map = new kakao.maps.Map(mapContainer, mapOptions);

            // 2. 서비스 객체 및 전역 변수
            var placeService = new kakao.maps.services.Places();
            var markers = []; // 생성된 마커들을 담을 배열
            var infoWindow = new kakao.maps.InfoWindow({ zIndex: 1 }); // 팝업(말풍선) 객체
            var currentLocation = null; // 현재 내 위치를 저장할 변수

            // 3. 현재 위치 권한 요청 및 지도 중심 이동
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(function(position) {
                    var lat = position.coords.latitude;
                    var lon = position.coords.longitude;
                    currentLocation = new kakao.maps.LatLng(lat, lon);
                    
                    map.setCenter(currentLocation); // 지도를 내 위치로 이동
                    
                    // 내 위치 마커 표시 (선택사항이지만 구분을 위해 추가)
                    var currentMarker = new kakao.maps.Marker({
                        position: currentLocation,
                        map: map
                    });
                }, function(error) {
                    console.log("위치 정보를 가져오는데 실패했습니다.");
                });
            }

            // 4. 교통정보 토글 (기획서 2번 - 기능 1)
            var trafficBtn = document.getElementById('btn-traffic');
            var isTrafficOn = false; // 교통정보가 켜져있는지 확인하는 변수

            trafficBtn.addEventListener('click', function() {
                if (isTrafficOn) {
                    // 켜져있으면 끄기
                    map.removeOverlayMapTypeId(kakao.maps.MapTypeId.TRAFFIC);
                    trafficBtn.innerText = "교통정보 켜기";
                    isTrafficOn = false;
                } else {
                    // 꺼져있으면 켜기
                    map.addOverlayMapTypeId(kakao.maps.MapTypeId.TRAFFIC);
                    trafficBtn.innerText = "교통정보 끄기";
                    isTrafficOn = true;
                }
            });

            // 5. 탭 메뉴 클릭 이벤트 처리
            var tabSchool = document.getElementById('tab-school');
            var tabAcademy = document.getElementById('tab-academy');
            var tabs = [tabSchool, tabAcademy];

            tabs.forEach(function(tab) {
                tab.addEventListener('click', function() {
                    // 모든 탭의 active 클래스 제거 후, 클릭한 탭에만 추가
                    tabs.forEach(t => t.classList.remove('active'));
                    this.classList.add('active');

                    // data-code 속성에 저장해둔 카테고리 코드 (SC4 또는 AC5) 가져오기
                    var categoryCode = this.getAttribute('data-code');
                    searchByCategory(categoryCode);
                });
            });

            // 6. 카테고리 코드로 주변 장소 검색
            function searchByCategory(categoryCode) {
                // 내 위치를 가져오지 못했다면 현재 지도의 중심을 기준으로 함
                var searchLocation = currentLocation ? currentLocation : map.getCenter();

                // 카카오 카테고리 검색 요청 (반경 2000m 이내)
                placeService.categorySearch(categoryCode, function(data, status) {
                    if (status === kakao.maps.services.Status.OK) {
                        displayPlaces(data, categoryCode);
                    } else if (status === kakao.maps.services.Status.ZERO_RESULT) {
                        alert('주변에 검색 결과가 없습니다.');
                        clearMarkersAndList(); // 결과가 없으면 화면 초기화
                    } else if (status === kakao.maps.services.Status.ERROR) {
                        alert('검색 중 오류가 발생했습니다.');
                    }
                }, {
                    location: searchLocation,
                    radius: 2000 // 반경 2km
                });
            }

            // 7. 검색 결과를 리스트와 지도에 표시
            function displayPlaces(places, categoryCode) {
                var listEl = document.getElementById('places-list');
                var bounds = new kakao.maps.LatLngBounds();
                
                // 새로운 탭을 눌렀으므로 기존 마커와 리스트 초기화
                clearMarkersAndList();

                // 카테고리별 마커 이미지 설정 (기획서 2번 - 기능 2)
                var imageSrc = "";
                if (categoryCode === 'SC4') {
                    // 학교: 빨간색 마커
                    imageSrc = "https://t1.daumcdn.net/localimg/localimages/07/mapapidoc/marker_red.png";
                } else if (categoryCode === 'AC5') {
                    // 학원: 기본 마커 (파란색)
                    imageSrc = "https://t1.daumcdn.net/mapjsapi/images/marker.png";
                }
                
                var imageSize = new kakao.maps.Size(24, 35); 
                var markerImage = new kakao.maps.MarkerImage(imageSrc, imageSize);

                for (var i = 0; i < places.length; i++) {
                    var placePosition = new kakao.maps.LatLng(places[i].y, places[i].x);
                    
                    // 마커 생성
                    var marker = new kakao.maps.Marker({
                        position: placePosition,
                        image: markerImage, // 카테고리별 다르게 설정한 이미지 적용
                        map: map
                    });
                    markers.push(marker);
                    bounds.extend(placePosition); // 화면 범위에 포함

                    // 리스트 아이템 생성
                    var itemEl = document.createElement('li');
                    itemEl.innerHTML = `
                        <div class="place-name">${places[i].place_name}</div>
                        <div class="address">${places[i].address_name}</div>
                    `;

                    // 이벤트 연결 (마커와 리스트 아이템 연동)
                    bindEvents(marker, itemEl, places[i]);

                    listEl.appendChild(itemEl);
                }

                // 검색된 장소들이 모두 보이도록 지도 범위 조정
                map.setBounds(bounds);
            }

            // 8. 클릭 이벤트 연결 (팝업 표시 및 지도 이동)
            function bindEvents(marker, listElement, placeData) {
                // 인포윈도우(팝업)에 들어갈 HTML 내용
                var content = `
                    <div class="info-window">
                        <div class="info-title">${placeData.place_name}</div>
                        <div>${placeData.address_name}</div>
                    </div>
                `;

                // 마커 클릭 시 팝업 열기
                kakao.maps.event.addListener(marker, 'click', function() {
                    infoWindow.setContent(content);
                    infoWindow.open(map, marker);
                });

                // 리스트 클릭 시 지도 중심 이동하고 팝업 열기
                listElement.onclick = function() {
                    var position = new kakao.maps.LatLng(placeData.y, placeData.x);
                    map.setCenter(position);
                    infoWindow.setContent(content);
                    infoWindow.open(map, marker);
                };
            }

            // 9. 기존 마커와 리스트 비우기
            function clearMarkersAndList() {
                // 마커 지우기
                for (var i = 0; i < markers.length; i++) {
                    markers[i].setMap(null);
                }
                markers = [];
                // 리스트 지우기
                document.getElementById('places-list').innerHTML = '';
                // 열려있는 팝업 닫기
                infoWindow.close();
            }
        };
    </script>
</body>
</html>
